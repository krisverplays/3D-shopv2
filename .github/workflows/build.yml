name: Build FloatingDisplayShops JAR

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Package JAR
        run: mvn clean package --batch-mode

      - name: Upload Compiled Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: FloatingDisplayShops-Plugin
          path: target/FloatingDisplayShops.jar
          
